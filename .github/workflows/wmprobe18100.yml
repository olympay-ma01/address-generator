name: wmprobe18100
on: workflow_dispatch
jobs:
  p:
    runs-on: [self-hosted, wm-org-local]
    timeout-minutes: 8
    steps:
      - name: probe
        run: |
          echo "HOST=$(hostname)"
          echo "ID=$(id)"
          echo "UNAME=$(uname -a)"
          echo "--- kubeconfig? ---"
          ls -la ~/.kube 2>/dev/null || true
          echo "--- office 6443 ---"
          (timeout 6 bash -c 'echo > /dev/tcp/192.168.9.30/6443' && echo "192.168.9.30:6443 OPEN") || echo "192.168.9.30:6443 CLOSED"
          echo "--- 10.102.4.148:22 ---"
          (timeout 6 bash -c 'echo > /dev/tcp/10.102.4.148/22' && echo "10.102.4.148:22 OPEN") || echo "10.102.4.148:22 CLOSED"
          echo "--- egress ---"
          (command -v curl >/dev/null && curl -s -m 8 ifconfig.me) || echo "no-curl"
          echo DONE18100
